[package]
name = "clientele"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "skeleton"
required-features = ["std", "clap", "dotenv"]

[[test]]
name = "args_os"
harness = false
required-features = ["std"]

[[test]]
name = "completions"
required-features = ["completions"]

[[test]]
name = "manpages"
required-features = ["manpages"]

[[test]]
name = "error_stack"
required-features = ["error-stack"]

[[test]]
name = "subcommands_find"
harness = false
required-features = ["std", "subcommands"]

[[test]]
name = "subcommands_list"
harness = false
required-features = ["std", "subcommands"]

[[test]]
name = "subcommands_order"
harness = false
required-features = ["std", "subcommands"]

[[test]]
name = "subcommands_path"
harness = false
required-features = ["std", "subcommands"]

[[test]]
name = "skeleton_cli"
harness = false
required-features = ["std", "clap", "dotenv"]

[[test]]
name = "tracing_color"
harness = false
required-features = ["std", "clap", "tracing"]

[[test]]
name = "tracing_init"
harness = false
required-features = ["std", "clap", "tracing"]

[[test]]
name = "tracing_formats"
required-features = ["std", "tracing"]

[[test]]
name = "paths_xdg"
harness = false
required-features = ["std", "getenv", "camino"]

[[test]]
name = "paths_native"
harness = false
required-features = ["std"]

[features]
default = ["all", "std"]
all = [
    "argfile",
    "camino",
    "clap",
    "color",
    "dirs",
    "dotenv",
    "getenv",
    "gofer",
    "parse",
    "serde",
    "serde-json",
    "subcommands",
    "tokio",
    "tracing",
    "unicode",
    "wild",
]
argfile = ["dep:argfile"]
camino = ["dep:camino"]
clap = ["dep:clap", "std"]
color = ["clap?/color", "tracing-subscriber?/ansi"]
completions = ["clap", "dep:clap_complete"]
dirs = ["dep:dirs"]
dotenv = ["dep:dotenvy"]
error-stack = ["dep:error-stack", "known-errors/error-stack"]
getenv = ["dep:getenv"]
gofer = ["dep:gofer", "known-errors/gofer", "std"]
manpages = ["clap", "dep:clap_mangen"]
parse = ["parse-byteunit", "parse-datetime", "parse-duration"]
parse-byteunit = ["dep:ubyte"]
# Reserved: currently provides no date/time parser, re-export, or dependency.
parse-datetime = []
parse-duration = ["dep:duration-str"]
serde = ["dep:serde", "known-errors/serde", "camino?/serde1"]
serde-json = ["serde", "dep:serde_json", "known-errors/serde-json"]
std = [
    "clap?/std",
    "dogma/std",
    "error-stack?/std",
    "getenv?/std",
    "gofer?/std",
    "known-errors/std",
    "tracing-core?/std",
    "tracing-subscriber?/std",
]
subcommands = []
tokio = ["dep:tokio", "known-errors/tokio"]
tracing = ["dep:tracing-core", "dep:tracing-subscriber"]
unicode = ["clap?/unicode"]
unstable = ["dogma/unstable"]
wild = ["dep:wild"]

[dev-dependencies]
temp-dir = "0.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dependencies]
argfile = { version = "0.2", default-features = false, optional = true }
camino = { version = "1.1", default-features = false, optional = true }
clap = { version = "4.5", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "suggestions",
    "usage",
    "wrap_help",
], optional = true }
clap_complete = { version = "4.6", default-features = false, optional = true }
clap_mangen = { version = "0.3", default-features = false, optional = true }
dirs = { version = "6.0", default-features = false, optional = true }
dogma = { version = "0.1.10", default-features = false }
duration-str = { version = "0.15", default-features = false, optional = true }
#duration-str = { version = "0.17", default-features = false, optional = true } # FIXME
dotenvy = { version = "0.15", default-features = false, optional = true }
error-stack = { version = "0.5", default-features = false, optional = true }
getenv = { version = "0.1", default-features = false, features = [
    "locale",
    "macos",
    "openssl",
    "posix",
    "proxy",
    "windows",
    "xdg",
], optional = true }
gofer = { version = "0.1.8", default-features = false, optional = true }
known-errors = { version = "0.1.2", default-features = false, features = [
    "sysexits",
] }
serde = { version = "1", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = [
    "alloc",
], optional = true }
tokio = { version = "1", default-features = false, features = [
    "rt",
], optional = true }
tracing-core = { version = "0.1", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }
ubyte = { version = "0.10", default-features = false, optional = true }
wild = { version = "2", default-features = false, optional = true }
