[package]
name = "clientele-consumer"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false

# Keep dependency features and the extern prelude independent of library tests.
[workspace]
resolver = "2"

[features]
default = ["cli"]
cli = ["clientele/clap", "clientele/dotenv"]
color = ["clientele/color"]
tracing = ["clientele/std", "clientele/tracing", "dep:tracing"]

[dependencies]
clientele = { path = "../../lib/clientele", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[[example]]
name = "skeleton"
path = "../../lib/clientele/examples/skeleton/main.rs"
required-features = ["cli"]

[[example]]
name = "scoped_tracing"
required-features = ["tracing"]
