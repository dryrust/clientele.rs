name: CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  release-tooling:
    name: Test release tooling
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Ruby and locked test dependencies
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0.6"
        bundler-cache: true
    - name: Test version bumps and rollback
      run: bundle exec rake test
  quality:
    name: Check code quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install stable Rust and quality tools
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: |
        cargo doc --workspace --no-deps --locked
        cargo doc --workspace --all-features --no-deps --locked
        cargo doc --workspace --no-default-features --no-deps --locked
        cargo doc --workspace --no-default-features --features clap --no-deps --locked
    - name: Check Clippy
      run: |
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  build-ubuntu:
    name: Build on Ubuntu (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.0", "stable"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Build
      run: cargo build --verbose --locked
    - name: Build examples
      run: cargo build --verbose --examples --locked
    - name: Run tests
      run: cargo test --verbose --locked
    - name: Install Python for feature checks
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Check standalone features and focused combinations
      run: python tests/check_features.py
    - name: Test all features
      run: cargo test --workspace --all-features --locked
    - name: Test downstream examples
      run: |
        cargo test --manifest-path tests/consumer/Cargo.toml --locked --target-dir target
        cargo test --manifest-path tests/consumer/Cargo.toml --all-features --locked --target-dir target
        cargo run --manifest-path tests/consumer/Cargo.toml --no-default-features --features tracing --example scoped_tracing --locked --target-dir target
    - name: Test packaged doctests
      shell: bash
      run: |
        cargo package -p clientele --locked --target-dir target
        for manifest in target/package/clientele-*/Cargo.toml; do
          cargo test --manifest-path "$manifest" --target-dir target --doc --locked
          cargo test --manifest-path "$manifest" --target-dir target --doc --no-default-features --locked
        done
  build-macos:
    name: Build on macOS (${{ matrix.toolchain }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.0", "stable"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Build examples
      run: cargo build --verbose --examples --locked
    - name: Run tests
      run: cargo test --workspace --locked
    - name: Test all features
      run: cargo test --workspace --all-features --locked
  build-windows:
    name: Build on Windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.0", "stable"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Build
      run: cargo build --verbose --locked
    - name: Build examples
      run: cargo build --verbose --examples --locked
    - name: Run tests
      run: cargo test --verbose --locked
    - name: Install Python for feature checks
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Check standalone features and focused combinations
      run: python tests/check_features.py
    - name: Test all features
      run: cargo test --workspace --all-features --locked
    - name: Measure Windows discovery
      if: matrix.toolchain == 'stable'
      run: cargo bench -p clientele --bench subcommands --no-default-features --features std,subcommands --locked
    - name: Test packaged doctests
      shell: bash
      run: |
        cargo package -p clientele --locked --target-dir target
        for manifest in target/package/clientele-*/Cargo.toml; do
          cargo test --manifest-path "$manifest" --target-dir target --doc --locked
          cargo test --manifest-path "$manifest" --target-dir target --doc --no-default-features --locked
        done
